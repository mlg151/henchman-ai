name: CI

on:
  push:
    branches: [main, "0.4.1", "v0.4.2", "release/v0.4.2"]
  pull_request:
    branches: [main, "0.4.1", "v0.4.2", "release/v0.4.2"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run Ruff Lint
        run: |
          uv run --extra dev ruff check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run Mypy
        run: |
          uv run --extra dev mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      DEEPSEEK_API_KEY: "dummy-test-key"
      OPENAI_API_KEY: "dummy-test-key"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run test suite
        run: |
          echo "::remove-matcher owner=checkout-git::"
          uv run --python ${{ matrix.python-version }} --extra dev pytest tests/ -q --no-cov

  build-check:
    name: Build & Package Validation
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build distributions
        run: |
          rm -rf dist/
          uv build

      - name: Validate distribution packages
        run: |
          uv run --with twine twine check dist/*

      - name: Retain validated PR distributions
        uses: actions/upload-artifact@v4
        with:
          name: validated-distributions-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

      - name: Set up Node for release workflow regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release workflow behavior without publication
        run: uv run --extra dev python -m pytest --no-cov tests/ops/test_release_workflow.py -q

  native-smoke:
    name: Installed Wheel Smoke (${{ matrix.os }}-${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    needs: build-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-distributions-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/

      - name: Run installed wheel smoke test
        shell: bash
        run: |
          echo "::remove-matcher owner=checkout-git::"
          echo "OS: ${{ matrix.os }}"
          echo "Python: ${{ matrix.python-version }}"
          echo "Source SHA: ${{ github.sha }}"
          
          uv venv --seed --python ${{ matrix.python-version }} "$RUNNER_TEMP/henchman-wheel-smoke"
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            smoke_python="$RUNNER_TEMP/henchman-wheel-smoke/Scripts/python.exe"
          else
            smoke_python="$RUNNER_TEMP/henchman-wheel-smoke/bin/python"
          fi
          
          $smoke_python tests/testing/installed_wheel_smoke.py --wheel-dir "$GITHUB_WORKSPACE/dist"

  aggregate-gate:
    name: Aggregate Readiness Gate
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build-check, native-smoke]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate requirements
        run: |
          python3 -c '
          import os
          import sys
          import json
          
          needs_json = json.loads(os.environ.get("NEEDS_JSON", "{}"))
          required_jobs = ["lint", "type-check", "test", "build-check", "native-smoke"]
          
          success_count = 0
          for job_id in required_jobs:
              outcome = needs_json.get(job_id)
              if outcome == "success":
                  success_count += 1
              else:
                  print(f"Job {job_id} did not succeed (status: {outcome})")
                  sys.exit(1)
          
          if success_count == len(required_jobs):
              print("All required jobs succeeded.")
              sys.exit(0)
          else:
              sys.exit(1)
          '
          env: NEEDS_JSON: ${{ toJSON(needs) }}
