name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-terminal-diagnostic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Observe editor and no-editor terminal attributes
        run: uv run --frozen --extra dev python -m pytest --no-cov tests/cli/test_draft_editor.py -k classic_f11_real_pty -vv -s
