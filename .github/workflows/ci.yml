name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Style
    runs-on: [self-hosted, homeserver]
    if: github.actor == github.repository_owner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff Lint
        run: |
          uv run --extra dev ruff check src/ tests/

  type-check:
    name: Type Check
    runs-on: [self-hosted, homeserver]
    if: github.actor == github.repository_owner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Mypy
        run: |
          uv run --extra dev mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, homeserver]
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DEEPSEEK_API_KEY: "dummy-test-key"
      OPENAI_API_KEY: "dummy-test-key"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test suite
        run: |
          echo "::remove-matcher owner=checkout-git::"
          uv run --python ${{ matrix.python-version }} --extra dev pytest tests/ -q --no-cov

  build-check:
    name: Build & Package Validation
    runs-on: [self-hosted, homeserver]
    if: github.actor == github.repository_owner
    needs: [lint, type-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build distributions
        run: |
          rm -rf dist/
          uv build

      - name: Validate distribution packages
        run: |
          uv run --with twine twine check dist/*
