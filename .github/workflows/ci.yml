name: CI

on:
  push:
    branches: [main, "0.4.1"]
  pull_request:
    branches: [main, "0.4.1"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Style
    runs-on: [self-hosted, homeserver]
    if: github.actor == github.repository_owner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff Lint
        run: |
          uv run --extra dev ruff check src/ tests/

  type-check:
    name: Type Check
    runs-on: [self-hosted, homeserver]
    if: github.actor == github.repository_owner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Mypy
        run: |
          uv run --extra dev mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    env:
      DEEPSEEK_API_KEY: "dummy-test-key"
      OPENAI_API_KEY: "dummy-test-key"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test suite
        run: |
          echo "::remove-matcher owner=checkout-git::"
          uv run --python ${{ matrix.python-version }} --extra dev pytest tests/ -q --no-cov

  build-check:
    name: Build & Package Validation
    runs-on: [self-hosted, homeserver]
    if: github.actor == github.repository_owner
    needs: [lint, type-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build distributions
        run: |
          rm -rf dist/
          uv build

      - name: Validate distribution packages
        run: |
          uv run --with twine twine check dist/*

      - name: Retain validated PR distributions
        uses: actions/upload-artifact@v4
        with:
          name: validated-distributions-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

      - name: Set up Node for release workflow regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release workflow behavior without publication
        run: uv run --extra dev python -m pytest --no-cov tests/ops/test_release_workflow.py -q


  native-smoke:
    name: Installed Wheel Smoke (Python ${{ matrix.python-version }})
    if: github.actor == github.repository_owner
    needs: [build-check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build distributions
        run: |
          rm -rf dist/
          uv build

      - name: Run installed wheel smoke test
        run: |
          echo "::remove-matcher owner=checkout-git::"
          uv run --python ${{ matrix.python-version }} --extra dev python tests/testing/installed_wheel_smoke.py --wheel-dir dist

