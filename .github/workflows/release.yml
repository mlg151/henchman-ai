name: Release & Publish to PyPI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish tested milestone release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: [self-hosted, homeserver]
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    environment:
      name: pypi
      url: https://pypi.org/p/henchman-ai
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout the tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve merged release PR milestone
        id: milestone
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: sha, per_page: 100,
            });
            const merged = prs.filter(pr => pr.merged_at && pr.base.ref === 'main' && pr.merge_commit_sha === sha);
            if (merged.length !== 1 || !merged[0].milestone) {
              throw new Error('A release requires one merged PR into main with a version milestone.');
            }
            core.setOutput('title', merged[0].milestone.title);
            core.setOutput('pr', merged[0].number);

      - name: Validate milestone and committed versions
        id: version
        env:
          RELEASE_MILESTONE: ${{ steps.milestone.outputs.title }}
        run: uv run --no-project python src/henchman/ops/release.py check

      - name: Reject conflicting tags
        id: existing
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const sha = context.payload.workflow_run.head_sha;
            let ref;
            try {
              ref = (await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (ref && ref.object.sha !== sha) throw new Error('Release tag already belongs to another commit.');

      - name: Build and validate distributions
        env:
          RELEASE_MILESTONE: ${{ steps.milestone.outputs.title }}
          RELEASE_PR: ${{ steps.milestone.outputs.pr }}
        run: |
          rm -rf dist/
          uv run --no-project python src/henchman/ops/release.py prepare
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --no-sources
          uv run --with twine twine check --strict dist/*

      - name: Qualify the exact wheel and source archive
        env:
          RELEASE_MILESTONE: ${{ steps.milestone.outputs.title }}
        run: uv run --no-project python src/henchman/ops/release.py qualify

      - name: Retain exact release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}-${{ github.event.workflow_run.head_sha }}-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

      - name: Retain release qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-checks-${{ github.event.workflow_run.head_sha }}-attempt-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: ignore

      - name: Publish distributions using the PYPI configuration secret
        env:
          PYPI: ${{ secrets.PYPI }}
          RELEASE_MILESTONE: ${{ steps.milestone.outputs.title }}
        run: uv run --no-project python src/henchman/ops/release.py publish

      - name: Tag and publish the GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PR: ${{ steps.milestone.outputs.pr }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const tag = process.env.RELEASE_TAG;
            const sha = context.payload.workflow_run.head_sha;
            const stem = 'henchman_ai-' + tag.slice(1);
            const names = [stem + '-py3-none-any.whl', stem + '.tar.gz'];
            const qualification = JSON.parse(fs.readFileSync('release-evidence/qualification.json', 'utf8'));
            if (qualification.schema_version !== 1 || qualification.commit !== sha ||
                qualification.version !== tag.slice(1) ||
                qualification.profile !== 'installed-wheel-smoke-v1' ||
                qualification.helper_sha256 !== crypto.createHash('sha256').update(
                  fs.readFileSync('tests/testing/installed_wheel_smoke.py')).digest('hex') ||
                Object.keys(qualification.runs || {}).sort().join(',') !== 'sdist,wheel' ||
                qualification.runs?.wheel?.passed !== true || qualification.runs?.sdist?.passed !== true) {
              throw new Error('Missing or mismatched release artifact qualification.');
            }
            for (const name of names) {
              const digest = crypto.createHash('sha256').update(fs.readFileSync('dist/' + name)).digest('hex');
              const kind = name.endsWith('.whl') ? 'wheel' : 'sdist';
              const run = qualification.runs[kind];
              if (qualification.artifacts?.[name] !== digest || run.artifact_sha256 !== digest ||
                  run.python !== '3.12' || !/^[0-9a-f]{64}$/.test(run.installed_wheel_sha256) ||
                  (kind === 'wheel' && run.installed_wheel_sha256 !== digest)) {
                throw new Error('Distribution differs from release artifact qualification.');
              }
            }
            try {
              const ref = (await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag})).data;
              if (ref.object.sha !== sha) throw new Error('Release tag belongs to another commit.');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...context.repo, ref: 'refs/tags/' + tag, sha});
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            let release = releases.find(item => item.tag_name === tag);
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: sha, name: tag, draft: true,
                body: `Released from PR #${process.env.RELEASE_PR}, commit ${sha}. See CHANGELOG.md for release notes.`,
              })).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100,
            });
            for (const name of names) {
              const data = fs.readFileSync('dist/' + name);
              if (qualification.artifacts[name] !== crypto.createHash('sha256').update(data).digest('hex')) {
                throw new Error('Distribution changed after release artifact qualification.');
              }
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                const digest = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
                if (existing.digest !== digest) {
                  throw new Error('Existing release asset differs from distribution: ' + name);
                }
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length},
              });
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id, target_commitish: sha, draft: false});

      - name: Clean generated build provenance
        if: always()
        run: rm -f src/henchman/_release.json
