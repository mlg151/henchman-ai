name: Release & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build distributions
    runs-on: [self-hosted, homeserver]
    if: github.actor == github.repository_owner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sdist and wheel
        run: |
          rm -rf dist/
          uv build

      - name: Validate package metadata
        run: |
          uv run --with twine twine check dist/*

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: [self-hosted, homeserver]
    needs: [build]
    if: (github.event_name == 'release' || inputs.publish_to_pypi == true) && github.actor == github.repository_owner
    environment:
      name: pypi
      url: https://pypi.org/p/henchman-ai
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: write  # For attaching assets to GitHub Release if needed
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (API Token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
