site_name: Henchman-AI
site_url: https://github.com/mlg151/henchman-ai
site_description: A Model-Agnostic AI Agent CLI in Python
site_author: Matthew

repo_name: mlg151/henchman-ai
repo_url: https://github.com/mlg151/henchman-ai

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Multi-Agent Dev Team: agents.md
  - Configuration:
    - Configuration: configuration.md
    - Intelligent Context Management: intelligent-context-management.md
  - Providers: providers.md
  - Tools: tools.md
  - MCP Integration: mcp.md
  - Extensions: extensions.md
  - API Reference: api.md
  - Behavioral Evaluations: evals/README.md
  - Contributing: CONTRIBUTING.md
  - Changelog: CHANGELOG.md
  - Release Checklist: RELEASE_CHECKLIST.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            filters: ["!^_"]
            members_order: source
            docstring_style: google
            show_signature_annotations: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mlg151/henchman-ai

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js
