[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "henchman-ai"
version = "0.4.1"
description = "A model-agnostic AI agent CLI - your AI henchman for the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Matthew", email = "matthew@example.com" }
]
keywords = ["cli", "ai", "agent", "llm", "deepseek", "openai", "anthropic", "henchman", "terminal", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "anyio>=4.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.5",
    "fastembed>=0.3",
    "chromadb>=1.5.9",
    "networkx>=3.0",
    "scipy>=1.11.2",
    "textual>=0.75",
    "appdirs>=1.4",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
    "python-multipart>=0.0",
    "black>=25.9",
]

[project.optional-dependencies]
discord = ["discord.py>=2.0"]
chat = ["discord.py>=2.0"]  # Alias: install all chat integrations
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Development dependencies with MINIMUM PACKAGE VERSIONS (e.g., 4, 0.4, 1.10)
    # ALL NUMBERS IN THIS SECTION ARE PACKAGE VERSION NUMBERS, NOT COVERAGE PERCENTAGES
    # CI enforces a 90% whole-project coverage floor; changed code should remain fully tested.
    "pytest-cov~=4.0",  # PACKAGE VERSION 4.0+, NOT THE COVERAGE THRESHOLD
    "ruff>=0.4",
    "mypy>=1.10",
    "discord.py>=2.0",  # For testing chat integration
    "types-PyYAML>=6",
    "types-networkx>=3",
    "pytest-mock>=3",
    "radon>=6",
]

[project.scripts]
henchman = "henchman.cli.app:main"
mlg = "henchman.cli.app:main"

[project.urls]
Homepage = "https://github.com/mlg151/henchman-ai"
Repository = "https://github.com/mlg151/henchman-ai"
Documentation = "https://github.com/mlg151/henchman-ai/tree/main/docs"
Changelog = "https://github.com/mlg151/henchman-ai/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/mlg151/henchman-ai/issues"
Discussions = "https://github.com/mlg151/henchman-ai/discussions"

[tool.hatch.build.targets.wheel]
packages = ["src/henchman"]
exclude = [
    "**/.env",
    "**/.env.*",
    "**/.pypirc",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.bak",
    "**/*.backup",
    "**/*.backup.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.tcss"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG002", # Unused method argument - needed for pytest fixtures with side effects
]

[tool.ruff.lint.per-file-ignores]
# pytest hooks receive a config argument that the hook intentionally ignores.
"tests/conftest.py" = ["ARG001"]


[tool.ruff.lint.isort]
known-first-party = ["henchman"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "discord.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=henchman --cov-config=pyproject.toml --cov-report=term-missing"
markers = [
    "e2e: marks end-to-end smoke and workflow tests",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "always_passes: marks behavioral eval as expected to always pass (run in CI)",
    "usually_passes: marks behavioral eval as expected to usually pass (run nightly)",
]

[tool.coverage.run]
source = ["src/henchman"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "pragma: no branch",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
partial_branches = [
    "pragma: no branch",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage*",
    "/htmlcov",
    "/site",
    "**/.env",
    "**/.env.*",
    "**/.pypirc",
    "/.agent_tasks",
    "/.claude",
    "/.henchman",
    "/.serena",
    "/tmp-wave-check",
    "/tmp-wave-secrets",
    "/tests/MagicMock",
    "/dist",
    "/test_output.log",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.bak",
    "**/*.backup",
    "**/*.backup.*",
]
