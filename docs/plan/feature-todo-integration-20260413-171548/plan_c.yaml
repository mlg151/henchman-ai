    title: Reconnect runtime web_search to a truthful exported implementation
    description: |
      Use the smallest safe code change to stop advertising a stub as a shipped Tier 1 tool. Rebind the Tier 1 `WebSearchTool` export to the concrete implementation that already exists under `src/henchman/tools/builtins/web_search.py`, preserve explicit dependency-unavailable behavior when optional packages are missing, and verify that registry/help discovery sees the same runtime truth users will execute.
