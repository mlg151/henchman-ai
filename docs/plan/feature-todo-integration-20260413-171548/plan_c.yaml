    agent: gem-implementer
    priority: high
    status: pending
    dependencies: []
    parallelizable: false
    conflicts_with: []
    security_sensitive: true
    file_targets:
      - src/henchman/tools/builtins/tier1_tools.py
      - src/henchman/tools/builtins/__init__.py
      - tests/tools/test_tier1_tools.py
    context_files:
      docs/prd.yaml: The PRD explicitly calls web_search export drift a must-resolve truth issue.
      src/henchman/tools/builtins/web_search.py: Existing concrete implementation should be reused instead of creating a new search backend.
      tests/cli/test_help_command.py: Help/discovery must report the same tool surface the registry exports.
    estimated_effort: small
    estimated_files: 3
    estimated_lines: 120
    focus_area: tier1 runtime truth
    verification:
      - uv run --extra dev python -m pytest tests/tools/test_tier1_tools.py -q
      - uv run --extra dev python -m pytest tests/cli/test_help_command.py -q
    acceptance_checks:
      - The exported `web_search` tool no longer resolves to a hardcoded unavailable placeholder when a concrete implementation exists.
      - Optional dependency failures remain explicit and deterministic instead of crashing or falsely succeeding.
      - Registry/discovery output derives from the same exported class users invoke at runtime.
    acceptance_criteria:
      - Tier 1 runtime discovery can truthfully describe `web_search` after this task lands.
      - No new hosted search service, registry, or remote backend is introduced.
      - The final user-visible behavior is either real DuckDuckGo-backed search or a clear dependency-unavailable result.
    failure_modes:
      - scenario: The export is rewired but the registry still instantiates stale placeholder metadata, leaving help/tool_search inconsistent with execution.
        likelihood: medium
        impact: high
        mitigation: Verify through both direct tool tests and help/discovery tests that the same export path is used end to end.
    task_definition: Replace the runtime web_search stub with a truthful, already-present implementation path.
    details: Keep this focused on export wiring and regression coverage, not broader search UX or dependency management redesign.
    tech_stack:
      - Python 3.12
      - aiohttp
      - beautifulsoup4
      - pytest
    test_coverage: Direct tool execution plus registry/help visibility regression coverage.
    requires_review: true
    review_depth: full
    review_security_sensitive: true

