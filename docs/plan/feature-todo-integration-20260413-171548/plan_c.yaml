tldr: |
  Variant C is truth-alignment-first. Land only the smallest runtime fixes that immediately stop the worst user harm — reconnect `web_search` to a truthful runtime surface and turn crashing marketplace installs into explicit unsupported guidance — then use those settled facts to aggressively narrow roadmap, help, and canonical docs around Tier 3/Tier 6/Tier 7/Tier 8/Tier 10 claims that are still local-only, metadata-only, blueprint-only, stubbed, or undiscoverable.
open_questions: []

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Docs are narrowed before the crashy install paths are fixed, so users still hit broken agent/plugin install flows even though the wording is more cautious.
      likelihood: medium
      impact: critical
      mitigation: Sequence the plan so install-path guardrails land in wave 1 and block all documentation work on passing targeted CLI regressions.
    - scenario: The web_search repair swaps one stub for another by bypassing the real implementation or hiding optional dependency failures behind misleading success states.
      likelihood: medium
      impact: high
      mitigation: Bind the Tier 1 export to the existing concrete implementation, keep dependency-unavailable messaging explicit, and verify through the same registry/help paths users hit.
    - scenario: The truth pass over-corrects and demotes confirmed-real foundations such as canonical `.henchman`, Tier 1/Tier 2 wiring, and local discovery of agents/skills/plugins.
      likelihood: medium
      impact: high
      mitigation: Use the PRD preserved truths plus AGENTS.md architectural notes as a review checklist before any roadmap/doc claim is rewritten.
  assumptions:
    - The concrete DuckDuckGo-based web search tool under src/henchman/tools/builtins/web_search.py is the intended runtime implementation to reuse rather than a new backend to build.
    - Agent/plugin registry installs remain out of scope unless they can be made truthful with boundary-level error handling instead of a real hosted marketplace.
    - Canonical roadmap/public truth surfaces for this pass are FEATURE_TODO.md, TODOS.md, README.md, docs/index.md, and CLI help/discovery copy.
    - Canonical `.henchman` behavior, Tier 1 plus most Tier 2 wiring, and local agent/skill/plugin discovery stay preserved and should not be re-opened.

implementation_specification:
  code_structure: Keep this variant adapter-heavy and backend-light. Repair truth at the boundaries where users experience it — builtin tool export wiring, top-level CLI command handlers, and canonical docs/help text — while avoiding new registries, runners, webhook services, Slack runtimes, sync backends, or Textual feature implementation.
  affected_areas:
    - src/henchman/tools/builtins for Tier 1 tool exports and registry-visible metadata
    - src/henchman/cli/app.py plus CLI command modules for agents-platform, plugin, help, and doctor truth messaging
    - FEATURE_TODO.md and TODOS.md as the roadmap source of truth
    - README.md and docs/index.md as the public product truth surface
    - tests/cli and tests/tools targeted regression suites for truth-alignment verification
  component_details:
    - component: Web search export surface
      responsibility: Ensure the runtime-visible `web_search` tool points at the real implementation or emits a truthful dependency-unavailable result instead of a hardcoded stub.
      interfaces:
        - WebSearchTool export in henchman.tools.builtins.tier1_tools
        - iter_available_builtin_tool_classes() registry discovery
    - component: Agent marketplace boundary
      responsibility: Keep local list/show/publish behavior real while converting registry install flows into explicit unsupported or registry-unavailable outcomes instead of crashes.
      interfaces:
        - henchman agents-platform list|show|install|remove|publish
        - AgentPlatformManager.install_agent()
    - component: Plugin marketplace boundary
      responsibility: Keep local plugin persistence/list/remove behavior real while preventing install flows from pretending the marketplace is shipped.
      interfaces:
        - henchman plugin list|install|remove
        - PluginManager.install_plugin()
    - component: Discovery truth layer
      responsibility: Make top-level help/discovery copy reflect shipped, local-only, export-only, metadata-only, or unavailable states for risky surfaces.
      interfaces:
        - root CLI lazy-command help_text values
        - henchman help search results and summaries
        - henchman doctor truth notes for required/discoverable surfaces
    - component: Canonical roadmap and public docs
      responsibility: Rewrite roadmap/public claims so Tier 3 marketplace/install flows, schedule_cron execution, MCP reload/registration, Slack runtime integration, Tier 8 services, and Tier 10 dialogs are no longer represented as complete without runtime proof.
      interfaces:
        - FEATURE_TODO.md and TODOS.md tier summaries
        - README.md feature/status sections
        - docs/index.md entrypoint links and guidance
  dependencies:
    - component: Web search export surface
      relationship: Supplies truthful runtime metadata to help, doctor, and tool discovery without inventing a new search backend.
    - component: Agent marketplace boundary
      relationship: Supplies non-crashing install semantics and truthful command copy to discovery/help and roadmap documentation.
    - component: Plugin marketplace boundary
      relationship: Supplies non-crashing install semantics and truthful command copy to discovery/help and public documentation.
    - component: Discovery truth layer
      relationship: Produces the canonical vocabulary that roadmap and public docs reuse for shipped versus partial surfaces.
    - component: Canonical roadmap and public docs
      relationship: Consume discovery/runtime truth and expose it in durable written form for maintainers and users.
  integration_points:
    - src/henchman/tools/builtins/tier1_tools.py and src/henchman/tools/builtins/__init__.py
    - src/henchman/cli/commands/agents_platform_command.py and src/henchman/agents/platform_manager.py
    - src/henchman/cli/commands/plugin_command.py and src/henchman/extensions/plugin_manager.py
    - src/henchman/cli/app.py, src/henchman/cli/commands/help_command.py, and src/henchman/cli/commands/doctor_command.py
    - FEATURE_TODO.md, TODOS.md, README.md, and docs/index.md

