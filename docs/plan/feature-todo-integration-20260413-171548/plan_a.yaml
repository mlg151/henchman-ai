        - 'persisted installation metadata from `install-github-app`'
    - component: Runtime discovery and truth messaging
      responsibility: Derive help, doctor, tool_search, command summaries, and public docs from live runtime capability classification instead of static aspirational metadata.
      interfaces:
        - '`henchman help`'
        - '`henchman doctor`'
        - '`tool_search`'
        - 'command help strings in `src/henchman/cli/app.py`'
