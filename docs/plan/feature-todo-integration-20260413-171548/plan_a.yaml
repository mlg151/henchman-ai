tldr: |
  Variant A is implementation-first: restore real web_search behavior, stop plugin and agents-platform install flows from crashing, reload MCP auth and re-register /mcp, add a local schedule runner, and wire the existing GitHub webhook invalidation helpers into the shipped server where the existing code already supports it. After those code repairs land, make help/doctor/tool_search and public roadmap/docs surfaces tell the same truth about what is runtime-wired, local-only, scaffold-only, or out of scope.
open_questions:
  - 'Should the local cron runner live behind an explicit user-started runtime loop or be piggybacked onto an existing always-on local process such as `serve`?'
  - If remote agent/plugin registry endpoints are unavailable in normal development, should this pass standardize on offline/local publication-aware flows as the default truth surface?
pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: Marketplace and install-flow repairs make agent or plugin acquisition non-crashing but silently weaken safety checks around downloaded code or metadata.
      likelihood: medium
      impact: critical
      mitigation: Keep compatibility, permission, and sandbox gates in the install path, add regression tests for unsafe or unavailable registry responses, and run a security review before acceptance.
    - scenario: The local schedule runner executes duplicate jobs, misses due runs, or triggers commands unexpectedly across restarts.
      likelihood: medium
      impact: high
      mitigation: Persist runner state separately from schedule definitions, make execution idempotent per due window, and add deterministic tests for create/pause/resume/restart behavior.
    - scenario: MCP auth reload restores tokens into the wrong runtime scope or leaks secret state through help, doctor, or status output.
      likelihood: medium
      impact: critical
      mitigation: Reload auth only through the existing auth service, redact tokens from all human output, and add status tests that verify boolean presence instead of token values.
    - scenario: GitHub webhook wiring exposes an unauthenticated endpoint or invalidates cache entries without signature verification.
      likelihood: medium
      impact: critical
      mitigation: Reuse the existing verified webhook service, require stored installation metadata plus secret configuration, and add route-level tests for valid, invalid, and disabled states.
    - scenario: Help, roadmap, and README wording only partially update after code repairs, leaving shipped claims drifted across multiple entry points.
      likelihood: high
      impact: high
      mitigation: Make live discovery/classification a prerequisite for doc work, then update command help and durable docs from one runtime-truth matrix.
  assumptions:
    - 'Canonical project-local configuration remains `.henchman` only, with no contract changes to Tier 1 foundations.'
    - Building new hosted registries, Slack runtimes, sync backends, or full Tier 8-10 distributed services remains out of scope for this pass.
    - Existing code for web search, GitHub webhook handling, MCP auth persistence, plugin registry access, and local schedule persistence is sufficient to support bounded wiring repairs.
    - Documentation parity must cover FEATURE_TODO.md, TODOS.md, README.md, docs/index.md, and command/help discoverability surfaces in the same pass.
implementation_specification:
  code_structure: Keep repairs inside existing seams rather than introducing new subsystems. Use concrete builtin implementations under src/henchman/tools/builtins for web_search and discovery, keep marketplace/install behavior in src/henchman/extensions and src/henchman/agents, reload MCP auth through src/henchman/mcp and existing REPL slash-command registration, extend src/henchman/advanced/schedule.py plus Tier 6 tools for local recurring execution, wire GitHub webhook handling into the existing FastAPI server, and update truth messaging in CLI/help/docs only after runtime classification is generated from live code paths.
  affected_areas:
    - src/henchman/tools/builtins/ and Tier 1/Tier 6 tool registration
    - src/henchman/extensions/ and src/henchman/agents/ install and marketplace management
    - src/henchman/mcp/ and REPL slash-command registration under src/henchman/cli/commands/
    - src/henchman/advanced/schedule.py and existing background task execution glue
    - src/henchman/api/server.py plus src/henchman/git/github_app.py
    - FEATURE_TODO.md, TODOS.md, README.md, docs/index.md, and nearby command/help text
  component_details:
    - component: Web search runtime surface
      responsibility: Replace the shipped web_search placeholder with the concrete runtime implementation and make failure modes dependency-aware and truthful instead of stubbed.
      interfaces:
        - 'ToolRegistry entry for `web_search`'
        - '`henchman.tools.builtins.tier1_tools.WebSearchTool`'
        - '`henchman.tools.builtins.web_search.DuckDuckGoSearchTool.execute(...)`'
    - component: Marketplace and install managers
      responsibility: Make plugin and agent install flows use real lookup sources or explicit offline/local fallbacks so install attempts never crash on stubbed registry behavior.
      interfaces:
        - '`PluginManager.search_plugins/get_plugin_info/install_plugin(...)`'
        - '`AgentPlatformManager.search_agents/get_agent_info/install_agent(...)`'
        - '`henchman plugin ...` and `henchman agents-platform ...`'
    - component: MCP runtime bridge
      responsibility: 'Reload persisted MCP auth tokens at startup and restore the interactive `/mcp` slash-command surface against the live manager API.'
      interfaces:
        - '`McpManager.create_from_settings(...)`'
        - '`McpManager.list_servers()/discover_tools()/set_auth_token()/clear_auth_token()`'
        - '`/mcp list|status|logging`'
    - component: Local recurring schedule runner
      responsibility: Extend metadata-only schedules into local executable recurring jobs with persisted status and bounded execution semantics.
      interfaces:
        - '`CronScheduleService.create_schedule/list_schedules/...`'
        - schedule runner dispatch/history API
        - '`schedule_cron` tool actions and status rendering'
    - component: GitHub webhook bridge
      responsibility: Reuse stored GitHub App metadata and existing webhook verification helpers to expose a truthful local cache-invalidation endpoint on the shipped API server.
      interfaces:
        - '`GitHubWebhookService.handle_event(...)`'
