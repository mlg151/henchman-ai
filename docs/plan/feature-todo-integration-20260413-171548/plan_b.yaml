objective: >-
  Deliver variant B as a balanced hybrid integration-truth pass: repair the
  tractable runtime wiring bugs that already have substantial code behind them,
  add truthful failure and discoverability UX for partial or local-only
  surfaces, and narrow roadmap/docs/help claims where full backends remain out
  of scope.
created_at: "2026-04-13T17:39:56Z"
created_by: gem-team:gem-planner
status: pending_approval
research_confidence: high

plan_metrics:
  wave_1_task_count: 5
  total_dependencies: 15
  risk_score: high

tldr: |
  Variant B fixes the highest-confidence integration gaps that are mostly wiring
  problems, not missing products: real web_search export, graceful non-crashing
  marketplace install UX for plugins and agents, and MCP auth/slash-command
  runtime wiring. In parallel, it makes local-only and export-only surfaces
  explicitly say what they do today, then uses that verified capability picture
  to rewrite roadmap/help/docs claims so large missing backends are no longer
  presented as shipped.

open_questions: []

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: >-
        The plan accidentally turns truth-alignment work into a promise to build
        full remote registries, webhook daemons, Slack runtimes, or schedule
        runners that the PRD explicitly keeps out of scope.
      likelihood: medium
      impact: critical
      mitigation: >-
        Keep code repairs limited to export, registration, startup reload, and
        graceful failure paths; require docs/help text to classify unsupported
        flows as unavailable, export-only, metadata-only, or local-only.
    - scenario: >-
        MCP auth reload or new help/doctor output leaks tokens or overexposes
        sensitive runtime state while trying to improve discoverability.
      likelihood: medium
      impact: critical
      mitigation: >-
        Reload only presence/status metadata into the manager, never echo token
        values, and review all new messaging for secret-safe wording.
    - scenario: >-
        Help, doctor, and tool_search still derive from different static sources,
        so docs and CLI messaging drift again immediately after the repair.
      likelihood: high
      impact: high
      mitigation: >-
        Centralize capability wording around live registration state plus explicit
        classification for placeholder/local/export-only surfaces, and verify all
        three discovery paths with focused regression tests.
    - scenario: >-
        Narrowing roadmap/docs claims erases confirmed working behavior such as
        canonical .henchman config, real Tier 1/Tier 2 wiring, and local
        agent/skill/plugin discovery.
      likelihood: medium
      impact: high
      mitigation: >-
        Anchor every doc change to source-verified behavior, preserve confirmed
        local capabilities verbatim, and require doc acceptance checks that
        working foundations remain explicitly documented.
  assumptions:
    - Canonical project-local configuration remains `.henchman/`, with no contract changes.
    - Tier 1 and most Tier 2 command wiring are already real and should be preserved.
    - Local discovery of agents, skills, and plugins is real even when marketplace/runtime flows are partial.
    - Full remote registries, schedule runners, webhook services, Slack runtimes, and Tier 8 remote backends remain out of scope for this pass.
    - Truthful failure UX is an acceptable outcome when end-to-end runtime wiring is not tractable in this variant.

implementation_specification:
  code_structure: >-
    Keep this pass as an integration-layer correction, not a subsystem rewrite.
    Reuse existing managers, command groups, and tool classes; swap placeholder
    exports for real implementations where code already exists; add thin runtime
    guards and capability messaging in the existing CLI/tool modules; and update
    docs/help from one verified capability picture rather than aspirational tier
    checklists.
  affected_areas:
    - src/henchman/tools/builtins/ for Tier 1/Tier 6 runtime truth and messaging
    - src/henchman/cli/commands/ for root CLI help, integrations, skill, plugin, agents-platform, and slash-command surfaces
    - src/henchman/mcp/ and REPL slash-command registration for auth reload and /mcp exposure
    - FEATURE_TODO.md, TODOS.md, README.md, docs/index.md, docs/extensions.md, and docs/mcp.md for truth-aligned claims
    - tests/cli/, tests/tools/, and focused MCP/plugin/agent command suites for regression coverage
  component_details:
    - component: Web search runtime surface
      responsibility: >-
        Expose the real web_search tool implementation through the shared Tier 1
        export surface and report dependency-driven unavailability truthfully
        instead of a permanent stub message.
      interfaces:
        - web_search builtin registration
        - ToolResult error content for missing web search dependencies
    - component: Marketplace install safety layer
      responsibility: >-
        Keep plugin and agents-platform install flows from crashing when the
        remote registry is unavailable, and return deterministic guidance that
        distinguishes local discovery/publish flows from unavailable marketplace
        flows.
      interfaces:
        - henchman plugin install/list/remove
        - henchman agents-platform install/show/list/publish
    - component: MCP bootstrap and auth persistence
      responsibility: >-
        Reload persisted MCP auth tokens at startup, expose /mcp in the REPL
        slash-command registry, and keep MCP status surfaces truthful without
        printing secrets.
      interfaces:
        - McpManager.create_from_settings(...)
        - /mcp <list|status|logging>
        - MCP auth presence/status reporting
    - component: Capability discovery surface
      responsibility: >-
        Make help, doctor, and tool_search reflect live runtime registration plus
        explicit local-only/export-only/metadata-only classifications for partial
        surfaces such as skills, integration blueprints, and schedule_cron.
      interfaces:
        - henchman help
        - henchman doctor / doctor-tool diagnostics
        - tool_search
    - component: Truth-aligned documentation
      responsibility: >-
        Rewrite roadmap and reference docs so they preserve confirmed working
        local features while narrowing unsupported claims for Tier 3-10 surfaces
        that are still stubbed, blueprint-only, local-only, or undiscoverable.
      interfaces:
        - FEATURE_TODO.md and TODOS.md roadmap state
        - README.md feature and usage claims
        - docs/index.md, docs/extensions.md, docs/mcp.md reference guidance
  dependencies:
    - component: Web search runtime surface
      relationship: Supplies a truthful live web_search capability that discovery and docs can reference.
    - component: Marketplace install safety layer
      relationship: Supplies non-crashing status and wording for plugin and agent marketplace claims used by help and docs.
    - component: MCP bootstrap and auth persistence
      relationship: Supplies the runtime-visible /mcp and auth status surface used by REPL discovery and docs.
    - component: Capability discovery surface
      relationship: Consumes repaired runtime surfaces and becomes the canonical wording source for CLI/help/docs parity.
    - component: Truth-aligned documentation
      relationship: Consumes the verified capability picture and narrows roadmap/reference claims without changing implementation scope.
  integration_points:
    - Existing Tier 1 builtin export surface in src/henchman/tools/builtins/tier1_tools.py and __init__.py
    - Existing plugin and agent marketplace managers in src/henchman/extensions/plugin_manager.py and src/henchman/agents/platform_manager.py
    - Existing REPL slash-command registration in src/henchman/cli/commands/builtins.py and src/henchman/cli/command_processor.py
    - Existing MCP startup flows in src/henchman/mcp/manager.py, src/henchman/cli/repl.py, and src/henchman/cli/core_init.py
    - Existing docs/help entrypoints in FEATURE_TODO.md, TODOS.md, README.md, docs/index.md, docs/extensions.md, and docs/mcp.md

