objective: >-
  Implement Tier 1 from FEATURE_TODO.md with TDD, foundations first, limited to:
  init, config, help, version, doctor, upgrade, project-local .hENCHMAN settings,
  local import/export sync helpers, output style persistence, keybinding/theme wiring,
  and the missing Tier 1 tools (ToolSearchTool, SkillTool, SleepTool) while treating
  WebSearchTool as existing functionality to normalize rather than rebuild.
