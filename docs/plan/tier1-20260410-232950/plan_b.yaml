tldr: |
  Variant B maximizes safe parallelism by splitting Tier 1 into four independent
  foundation tracks first: package/version entrypoints, config loading, tool/security
  imports, and command abstractions. Once those contracts are stable, the execution
  loop can run settings storage, system introspection, and Tier 1 tool additions in
  parallel, then fan out the user-facing commands as isolated TDD slices, and finish
  with one app.py integration pass plus a security review. Scope stays strictly inside
  Tier 1 and honors the clarifications: foundations first, no remote sync backend,
  upgrade is guided pip/uv/pipx detection, and config is key-based with import/export.

open_questions: []

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: >-
        The new .hENCHMAN project-local layer diverges from existing ~/.henchman
        assumptions and silently breaks plugin, history, or settings resolution.
      likelihood: medium
      impact: critical
      mitigation: >-
        Keep home-directory behavior backward-compatible, add explicit path-resolution
        tests, and isolate Tier 1 local settings under a dedicated resolver instead of
        ad hoc path joins across commands.
    - scenario: >-
        CLI-oriented tests still fail during collection because eager imports in app,
        tool registration, or slash-command modules pull in missing non-Tier-1 code.
      likelihood: high
      impact: critical
      mitigation: >-
        Restore import surfaces first, switch builtins/tool registration to lazy or
        capability-based loading, and gate command integration behind targeted Tier 1
        smoke tests before broad CLI execution.
    - scenario: >-
        Upgrade detection chooses the wrong package manager or executes an unsafe
        self-update command for the current install method.
      likelihood: medium
      impact: critical
      mitigation: >-
        Detect pip/uv/pipx from interpreter and installation metadata, default to a
        dry-run/explain mode, require explicit opt-in for execution, and funnel command
        text through the shared security sanitization layer.
    - scenario: >-
        Config import/export or doctor output leaks secrets or writes invalid settings
        that corrupt future CLI startup.
      likelihood: medium
      impact: high
      mitigation: >-
        Validate all imported content against the schema, redact secret-like keys in
        human-readable output, and use atomic write/backup behavior for config writes.
  assumptions:
    - Existing click-based root CLI in src/henchman/cli/app.py remains the Tier 1 command surface.
    - Existing theme and keybinding fields in schema are reusable rather than replaced.
    - WebSearchTool already exists semantically and only needs registry/import normalization.
    - Tier 1 acceptance can rely on targeted CLI/Tier 1 suites before unrelated agent-module gaps are addressed.
    - Settings sync is satisfied by local export/import workflows only; no backend or network sync is in scope.

implementation_specification:
  code_structure: >-
    Keep Tier 1 split into reusable service modules plus thin click command adapters.
    Put package/config/tool foundations behind import-stable modules, add dedicated
    Tier 1 command modules under henchman.cli.commands, centralize settings read/write
    and project-local .hENCHMAN resolution in config services, centralize package-manager
    and update detection in CLI support modules, and perform root CLI registration only
    in the final integration pass to minimize merge conflicts.
  affected_areas:
    - src/henchman/__init__.py and version/entrypoint package surface
    - src/henchman/config/ for settings loading, project-local overlays, import/export, and environment/context helpers
    - src/henchman/tools/ and src/henchman/tools/builtins/ for security helpers and Tier 1 tool registration
    - src/henchman/cli/commands/ and src/henchman/cli/app.py for click commands and final wiring
    - tests/cli/, tests/config/, tests/tools/, and tests/test_main.py for Tier 1 TDD coverage
  component_details:
    - component: Package surface
      responsibility: >-
        Provide import-stable VERSION/__version__/python -m entrypoints required by the
        click app and Tier 1 smoke tests.
      interfaces:
        - henchman.__version__
        - henchman.version.VERSION
        - python -m henchman -> henchman.cli.app.main
    - component: Config surface
      responsibility: >-
        Load merged settings from global and project-local locations, expose
        ContextLoader/environment helpers expected by the CLI, and support schema validation.
      interfaces:
        - "load_settings(project_root: Path | None = None) -> Settings"
        - "ContextLoader.load() -> str"
        - "gather_environment() / format_environment_block(...)"
    - component: Settings repository
      responsibility: >-
        Perform key-path get/set/list plus import/export over validated settings,
        including .hENCHMAN project-local persistence and output-style/theme/keybinding fields.
      interfaces:
        - "SettingsRepository.get(key_path: str, scope: str) -> object"
        - "SettingsRepository.set(key_path: str, value: object, scope: str) -> None"
        - "SettingsRepository.export_settings(...) / import_settings(...)"
    - component: Tool foundation
      responsibility: >-
        Sanitize shell/update command text, make builtin tool registration resilient to
        partial implementations, and register Tier 1 tools without eager-import failures.
      interfaces:
        - "sanitize_command(command: str) -> str"
        - "sanitize_error_message(message: str) -> str"
        - "ToolManager.register_builtin_tools()"
    - component: System introspection
      responsibility: >-
        Detect current install method, package manager, installed version, and environment
        health signals reused by version/doctor/upgrade.
      interfaces:
        - "detect_install_method() -> InstallMethod"
        - "build_update_guidance(run: bool) -> UpdatePlan"
        - "collect_doctor_checks() -> list[DoctorCheck]"
    - component: Tier 1 commands
      responsibility: >-
        Implement init/config/help/version/doctor/upgrade as command modules that run
        red-green-refactor inside each slice and return structured results for text/json output.
      interfaces:
        - click command factories or register_* helpers for each Tier 1 command
        - shared command metadata for help search
    - component: Tier 1 tools
      responsibility: >-
        Add ToolSearchTool, SkillTool, and SleepTool and normalize the existing WebSearchTool
        so help/doctor/tool listings can discover the full Tier 1 tool surface.
      interfaces:
        - tool_search
        - skill
        - sleep
        - web_search
  dependencies:
    - component: Package surface
      relationship: Supplies stable imports to app.py, tests, and version command logic.
    - component: Config surface
      relationship: Supplies validated settings and environment/context data to all Tier 1 commands.
    - component: Settings repository
      relationship: Consumes Config surface and is consumed by init/config/doctor/CLI integration.
    - component: Tool foundation
      relationship: Supplies safe command handling and registry behavior to tool additions and upgrade.
    - component: System introspection
      relationship: Supplies install/update/environment facts to version, doctor, and upgrade commands.
    - component: Tier 1 tools
      relationship: Supplies searchable tool metadata and runtime behavior to help and doctor flows.
    - component: Tier 1 commands
      relationship: Consume repositories/services and are wired into the click root during final integration.
  integration_points:
    - Existing click CLI group in src/henchman/cli/app.py
    - Existing slash-command/builtin command support in src/henchman/cli/commands/builtins.py
    - Existing schema defaults for theme and keybindings in src/henchman/config/schema.py
    - Existing tool registry and shell tool sanitization call sites in src/henchman/tools/registry.py and src/henchman/tools/builtins/shell.py
    - Existing tests that import henchman.config, henchman.version, and henchman.tools.builtins

