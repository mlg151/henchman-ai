      the click app. Keep this limited to entrypoints/version plumbing, not broader agent
      repairs. This task exists because app.py and smoke tests currently import missing
      package files before any Tier 1 feature code can run.
    task_definition: Establish an import-stable package/version surface for Tier 1.
    details:
      - Start by adding or updating tests that import henchman.version and henchman.__main__.
      - Implement only the package entrypoint/version files needed for Tier 1 startup and smoke tests.
      - Preserve the current package version source of truth in code rather than duplicating logic per command.
