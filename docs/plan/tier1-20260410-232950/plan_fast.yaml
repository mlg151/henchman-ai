tldr: |
  Fix the broken bootstrap surface first, then build local settings/config plumbing, Tier 1 command slices, and the missing core tools in parallel. Keep settings sync file-local, preserve partial help/version/theme/keybinding/web-search behavior, and finish with registry wiring plus targeted verification.

open_questions: []

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: "Config bootstrap still misses an import path used by app, API, chat, or TUI code."
      likelihood: medium
      impact: high
      mitigation: "Land a bootstrap smoke test first, then verify every public config import path before feature work starts."
    - scenario: "Local settings precedence or import/export corrupts user config or resolves the wrong file."
      likelihood: medium
      impact: high
      mitigation: "Implement round-trip tests for defaults, user config, and project-local .henchman files before wiring commands."
    - scenario: "New CLI commands or tools are added but not registered cleanly, causing collection-time failures or missing surfaces."
      likelihood: high
      impact: high
      mitigation: "Separate module creation from wiring, then add a final registry smoke pass that validates discovery and import safety."
  assumptions:
    - "Settings sync remains local import/export only; no backend or cloud sync is required."
    - "Existing help/version/theme/keybinding/web-search behavior can be extended instead of replaced."
    - "Package-manager upgrade guidance can print a command by default and optionally run it when the install method is known."

implementation_specification:
  code_structure: |
    Keep config bootstrap in src/henchman/config/__init__.py with ContextLoader and environment helpers in sibling modules, and move settings persistence into a dedicated store module. Add Tier 1 CLI commands as focused modules under src/henchman/cli/commands/, keep tool implementations under src/henchman/tools/builtins/, and finish with thin registry wiring so imports stay lazy and safe.
  affected_areas:
    - src/henchman/config/
    - src/henchman/tools/
    - src/henchman/cli/commands/
    - src/henchman/cli/
    - tests/config/
    - tests/cli/
    - tests/tools/
  component_details:
    - component: config bootstrap
      responsibility: Expose load_settings, Settings, ContextLoader, and environment helpers for app/API/TUI import sites.
      interfaces:
        - "load_settings()"
        - "Settings"
        - "ContextLoader"
        - "gather_environment()"
        - "format_environment_block()"
    - component: settings store
      responsibility: Resolve defaults, user settings, and project-local .henchman files; support local import/export round trips.
      interfaces:
        - "load_settings()"
        - "save_settings()"
        - "import_settings()"
        - "export_settings()"
        - "resolve_settings_paths()"
    - component: Tier 1 command modules
      responsibility: Implement config, init, help search, version/update, doctor, and guided upgrade behavior without redesigning the command system.
      interfaces:
        - "ConfigCommand"
        - "InitCommand"
        - "HelpCommand"
        - "VersionCommand"
        - "DoctorCommand"
        - "UpgradeCommand"
    - component: missing core tools
      responsibility: Add ToolSearchTool, SkillTool, WebSearchTool, and SleepTool with consistent naming and registry-friendly constructors.
      interfaces:
        - "ToolSearchTool"
        - "SkillTool"
        - "WebSearchTool"
        - "SleepTool"
    - component: registry hardening
      responsibility: Keep builtins imports safe, sanitize tool errors, and avoid collection-time failures from missing optional modules.
      interfaces:
        - "sanitize_error_message()"
        - "ToolRegistry.execute()"
        - "ToolRegistry.get_declarations()"
  dependencies:
    - component: config bootstrap
      relationship: "Feeds settings store, CLI commands, API startup, and TUI initialization."
    - component: settings store
      relationship: "Backs config CLI, init flow, and all runtime settings consumers."
    - component: registry hardening
      relationship: "Prepares the tool namespace before Tier 1 tool modules are added."
    - component: Tier 1 command modules
      relationship: "Depend on settings store and become discoverable only after command wiring."
    - component: missing core tools
      relationship: "Depend on registry hardening and become discoverable only after tool wiring."
  integration_points:
    - src/henchman/cli/app.py
    - src/henchman/api/server.py
    - src/henchman/cli/chat_serve.py
    - src/henchman/cli/textual_mixins.py
    - src/henchman/cli/core_init.py
    - src/henchman/cli/command_processor.py
    - src/henchman/cli/tool_manager.py
    - src/henchman/cli/console.py
    - src/henchman/cli/repl.py

