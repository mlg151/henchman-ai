tldr: |
  Start by repairing the broken public import surface so Tier 1 tests can collect and fail for the right reasons. Once the baseline is green, build a shared local-settings layer with file-based import/export only, then deliver isolated TDD feature slices for help/version/upgrade, config, output preferences, doctor, init, and the missing Tier 1 tools. Keep implementation scoped to Tier 1 by extending existing help/version/theme/keybinding/WebSearch primitives instead of redesigning later-tier systems.
open_questions: []

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: Baseline import shims stay incomplete, so Tier 1 tests never reach feature assertions and every later slice debugs infrastructure instead of behavior.
      likelihood: high
      impact: critical
      mitigation: Land explicit regression tests for known import gaps first and gate all feature tasks on a green targeted collection run.
    - scenario: Settings portability drifts into backend sync or inconsistent directory semantics, expanding scope beyond Tier 1 and breaking existing local-path conventions.
      likelihood: medium
      impact: high
      mitigation: Centralize all portability work in one repository layer limited to local import/export files and keep project-local settings behavior explicitly file-based.
    - scenario: Guided upgrade executes the wrong package-manager command or runs unsafe commands without a clear dry-run path.
      likelihood: medium
      impact: critical
      mitigation: Detect pip, uv, and pipx deterministically, default to printing guidance unless an explicit run flag is present, and run the final flow through security review.
    - scenario: New command slices collide in shared CLI wiring, reducing parallelism and causing repeated merge churn in app.py.
      likelihood: medium
      impact: high
      mitigation: Introduce a command-registration seam up front so later command tasks primarily add dedicated modules with minimal shared-file edits.
  assumptions:
    - Existing Click-based CLI entrypoints remain the Tier 1 command surface.
    - Settings sync is local import/export only; no hosted or background sync backend is introduced.
    - Guided upgrade detects pip, uv, or pipx and prints guidance by default unless the command explicitly opts into execution.
    - Existing theme, keybinding, and WebSearch support should be extended and normalized, not replaced.
    - FEATURE_TODO's project-local settings directory maps onto the repo's existing .henchman path conventions unless a compatibility alias is needed.

implementation_specification:
  code_structure: Introduce a thin compatibility layer first (config public API, CLI command registration seam, tool security helpers), then build Tier 1 slices as dedicated modules that depend on shared settings and tool abstractions instead of editing monolithic files repeatedly.
  affected_areas:
    - src/henchman/config
    - src/henchman/cli
    - src/henchman/tools
    - tests/cli
    - tests/config
    - tests/tools
  component_details:
    - component: Config public API
      responsibility: Export load/save/path helpers, settings repository access, context loading, and version metadata required to make the CLI import cleanly.
      interfaces:
        - load_settings() -> Settings
        - save_settings(settings, scope=global|project) -> None
        - export_settings(path, scope=global|project) -> None
        - import_settings(path, scope=global|project) -> Settings
        - VERSION constant for CLI version surfaces
    - component: Tier 1 command registry seam
      responsibility: Provide a stable place for dedicated top-level command modules to register with the Click app while preserving existing help/version behavior.
      interfaces:
        - register_tier1_commands(cli_group) -> None
        - CommandContext / CommandRegistry compatibility exports for existing slash-command tests
    - component: Local settings repository
      responsibility: Resolve defaults, user settings, and project-local settings with deterministic precedence plus local import/export helpers.
      interfaces:
        - resolve_settings_paths() -> settings locations
        - load_merged_settings() -> Settings
        - mutate_key(path, value|unset) -> Settings
        - import_local_settings(file) / export_local_settings(file)
    - component: Operational CLI commands
      responsibility: Implement init, config, help search, version update check, doctor diagnostics, and guided upgrade as isolated Click subcommands.
      interfaces:
        - henchman init
        - henchman config view|get|set|unset|import|export
        - henchman help [query]
        - henchman version [--check]
        - henchman doctor
        - henchman upgrade [--run]
    - component: Tier 1 tool bundle
      responsibility: Make ToolSearchTool, SkillTool, SleepTool, and normalized WebSearchTool available through the registry with consistent declarations and behavior.
      interfaces:
        - tool_search(query) -> matching tool metadata
        - skill(name, args?) -> skill invocation result or structured error
        - sleep(seconds) -> deterministic pause result
        - web_search(query) -> normalized search result
  dependencies:
    - component: Tier 1 command registry seam
      relationship: Registers dedicated operational CLI command modules with the existing Click app and slash-command compatibility layer.
    - component: Local settings repository
      relationship: Supplies config, init, doctor, and output-preference flows with validated settings reads and writes.
    - component: Config public API
      relationship: Wraps schema and context loading so app, REPL, and command modules share one stable import surface.
    - component: Tier 1 tool bundle
      relationship: Depends on repaired tool security helpers and built-in tool registration.
  integration_points:
    - src/henchman/cli/app.py for top-level command registration and existing help/version extension points
    - src/henchman/cli/repl.py and src/henchman/cli/textual_config.py for output-style, theme, and keybinding runtime wiring
    - src/henchman/cli/tool_manager.py and src/henchman/tools/builtins/__init__.py for Tier 1 tool registration
    - src/henchman/config/schema.py and new config helpers for persistent settings precedence and validation
    - Targeted pytest suites under tests/cli, tests/config, and tests/tools for TDD gating

contracts:
  - from_task: tier1-foundation-config-runtime
    to_task: tier1-local-settings-layer
    interface: Stable config public API with settings load/save/import/export entrypoints and path resolution.
    format: Python functions returning validated Settings objects and pathlib paths.
  - from_task: tier1-foundation-cli-command-surface
    to_task: tier1-help-version-upgrade
    interface: Command-registration seam that accepts dedicated Click command modules without repeated app.py rewrites.
    format: register_tier1_commands(cli_group) hook plus compatibility exports.
  - from_task: tier1-foundation-cli-command-surface
    to_task: tier1-config-command
    interface: Shared command-registration surface and command test harness imports.
    format: Click group registration plus CommandContext/CommandRegistry/parser exports.
  - from_task: tier1-foundation-tool-security-surface
    to_task: tier1-tool-bundle
    interface: Safe tool registration and command sanitization helpers for new Tier 1 tools.
    format: tools.security helpers and a builtins registration manifest.
  - from_task: tier1-local-settings-layer
    to_task: tier1-config-command
    interface: Nested key mutation and local import/export API for project and user settings.
    format: Repository methods that accept dotted keys and return validated Settings snapshots.
  - from_task: tier1-local-settings-layer
    to_task: tier1-output-preferences
    interface: Persisted preference reads/writes for output_style, theme, keybindings, and style overrides.
    format: Validated Settings fields plus repository update helpers.
  - from_task: tier1-local-settings-layer
    to_task: tier1-doctor-command
    interface: Resolved settings paths and merged configuration snapshot for diagnostics.
    format: Immutable settings snapshot plus origin metadata.
  - from_task: tier1-output-preferences
    to_task: tier1-init-wizard
    interface: Enumerated preference options and persistence helpers for wizard selections.
    format: Structured option lists and repository write helpers.

