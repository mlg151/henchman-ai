tldr: Tier 1 is reordered into foundations, shared config plumbing, then split CLI slices. Canonical project-local settings live in .henchman with legacy-casing read fallback only, repository work is split into core CRUD/path validation plus import/export sync helpers, config explicitly covers view and unset flows, upgrade stays argv-safe and manually falls back on ambiguity, and tool additions land after the command slices they support.
open_questions: []
pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
  - scenario: Canonical .henchman resolution regresses and legacy casing is treated as a new write target instead of a read-only fallback.
    likelihood: medium
    impact: critical
    mitigation: Make .henchman the only write path, add explicit path-resolution tests, and keep any legacy casing support read-only.
  - scenario: Config view, unset, or import/export surfaces leak secrets or mutate the wrong scope.
    likelihood: medium
    impact: high
    mitigation: Route all reads/writes through the shared repository, validate payloads before persistence, and redact sensitive values in human output.
  - scenario: Upgrade execution constructs unsafe shell text or targets the wrong package/executable binding.
    likelihood: medium
    impact: critical
    mitigation: Keep sanitization in the shared tool foundation, execute via argv only, bind commands to the detected install metadata, and fall back to manual guidance on ambiguity.
  - scenario: Doctor/tool health checks are wired before the required tools exist, creating hidden coupling and flaky command behavior.
    likelihood: medium
    impact: high
    mitigation: Split tool-health checks into their own slice, make them depend on tool additions, and keep the core doctor checks read-only and deterministic.
  assumptions:
  - Existing click-based root CLI in src/henchman/cli/app.py remains the Tier 1 command surface.
  - Settings sync is local import/export only; no networked backend is in scope.
  - Project-local settings canonicalize to .henchman, with backward-compatible read fallback for historical casing variants only.
  - Existing theme, output-style, and keybinding schema fields are reusable rather than replaced.
  - WebSearchTool is already present semantically and only needs registry/import normalization.
implementation_specification:
  code_structure: Keep Tier 1 split into reusable service modules plus thin click command adapters. Put canonical project-local settings resolution in src/henchman/config/paths.py, keep loader/context helpers in src/henchman/config/__init__.py plus context.py/environment.py, centralize schema and repository behavior in src/henchman/config/schema.py and repository.py, place command slices under src/henchman/cli/commands, keep shared sanitization in src/henchman/tools/security.py, and delay root CLI registration in src/henchman/cli/app.py until the final integration pass.
  affected_areas:
  - src/henchman/__init__.py and version/entrypoint package surface
  - src/henchman/config/ for path resolution, loading, repository, schema, and environment helpers
  - src/henchman/tools/ and src/henchman/tools/builtins/ for security helpers and Tier 1 tool registration
  - src/henchman/cli/commands/ and src/henchman/cli/app.py for click commands and final wiring
  - tests/cli/, tests/config/, tests/tools/, and tests/test_main.py for Tier 1 TDD coverage
  component_details:
  - component: Package surface
    responsibility: Provide import-stable VERSION/__version__/python -m entrypoints required by the click app and Tier 1 smoke tests.
    interfaces:
    - henchman.__version__
    - henchman.version.VERSION
    - python -m henchman -> henchman.cli.app.main
  - component: Config path resolver
    responsibility: Resolve the canonical project-local .henchman path and support read-only legacy-casing fallback when older projects already exist.
    interfaces:
    - 'resolve_project_settings_path(project_root: Path | None = None) -> Path'
    - resolve_legacy_project_settings_path(...) -> Path | None
  - component: Config surface
    responsibility: Load merged settings, expose ContextLoader/environment helpers, and keep startup context formatting deterministic.
    interfaces:
    - 'load_settings(project_root: Path | None = None) -> Settings'
    - ContextLoader.load() -> str
    - gather_environment() / format_environment_block(...)
  - component: Settings schema/repository
    responsibility: Validate and persist key-based settings CRUD, view, unset, and import/export flows for local sync.
    interfaces:
    - 'SettingsRepository.get(key_path: str, scope: str) -> object'
    - 'SettingsRepository.set(key_path: str, value: object, scope: str) -> None'
    - 'SettingsRepository.unset(key_path: str, scope: str) -> None'
    - SettingsRepository.export_settings(...) / import_settings(...)
  - component: System introspection
    responsibility: Detect install method, package manager, installed version, and environment health signals reused by version/doctor/upgrade.
    interfaces:
    - detect_install_method() -> InstallMethod
    - build_update_guidance() -> UpdatePlan
    - collect_doctor_checks() -> list[DoctorCheck]
  - component: Command slices
    responsibility: Implement init/config/help/version/doctor/upgrade as isolated TDD slices and return structured results for text/json output.
    interfaces:
    - register_init_command(cli) or click.Command object
    - config view/set/unset/import/export command factories
    - doctor core/tool command factories
    - register_upgrade_command(cli) or click.Command object
  - component: Tier 1 tools
    responsibility: Add ToolSearchTool, SkillTool, and SleepTool and normalize the existing WebSearchTool so help/doctor/tool listings can discover the full Tier 1 tool surface.
    interfaces:
    - tool_search
    - skill
    - sleep
    - web_search
  dependencies:
  - component: Package surface
    relationship: Supplies stable imports to app.py, tests, and version command logic.
  - component: Config path resolver
    relationship: Feeds the config surface and repository so all writes target .henchman while legacy reads remain compatible.
  - component: Config surface
    relationship: Supplies validated settings and environment/context data to the repository and Tier 1 commands.
  - component: Settings schema/repository
    relationship: Backs init/config/doctor command slices with validated CRUD and local import/export behavior.
  - component: System introspection
    relationship: Supplies install/update/environment facts to version, doctor, and upgrade commands.
  - component: Tier 1 tools
    relationship: Supplies searchable tool metadata and runtime behavior to help and doctor flows.
  - component: Command slices
    relationship: Consume repositories/services and are wired into the click root during final integration.
  integration_points:
  - Existing click CLI group in src/henchman/cli/app.py
  - Existing slash-command/builtin command support in src/henchman/cli/commands/builtins.py
  - Existing schema defaults for theme and keybindings in src/henchman/config/schema.py
  - Existing tool registry and shell tool sanitization call sites in src/henchman/tools/registry.py and src/henchman/tools/builtins/shell.py
  - Existing tests that import henchman.config, henchman.version, and henchman.tools.builtins
