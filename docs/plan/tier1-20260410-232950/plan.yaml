objective: Implement Tier 1 from FEATURE_TODO.md with TDD and foundations first, limited to init, config view/write/unset, help, version, doctor, guided upgrade, canonical project-local .henchman settings with backward-compatible legacy-casing read fallback, local import/export sync helpers, output style persistence, keybinding/theme wiring, and the missing Tier 1 tools while treating WebSearchTool as existing functionality to normalize rather than rebuild.
