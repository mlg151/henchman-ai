tldr: |
  Repair the broken import surface first so targeted TDD is reliable, then fan out into
  parallel Tier 1 slices: settings plumbing, operational CLI commands, UI-facing settings,
  and missing tool surfaces. Reuse the existing Click CLI, settings schema, theming system,
  and partial WebSearch wiring; avoid cloud sync and keep portability to local import/export.

open_questions:
  - Decide during foundation repair whether clean collection is fastest via compatibility re-exports or restoring small missing modules from existing patterns.
  - Confirm whether update checks should use PyPI metadata only or an existing package metadata helper before implementing version and upgrade details.
  - Confirm whether help search should index only CLI commands or CLI commands plus registered tools while staying within Tier 1 scope.

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: Foundation repair is scoped too narrowly, leaving non-Tier-1 import gaps that still break pytest collection and block all later TDD work.
      likelihood: high
      impact: critical
      mitigation: Start with regression tests that codify the broken public surfaces, then require a clean targeted collection checkpoint before any feature slice begins.
    - scenario: Settings plumbing and config mutation logic diverge, causing init, config, doctor, and UI settings to persist different shapes or precedence rules.
      likelihood: medium
      impact: high
      mitigation: Centralize path resolution, load/merge, validation, and import/export helpers behind one settings service contract consumed by all commands.
    - scenario: Upgrade and tool-surface work introduces unsafe execution paths or inconsistent command discovery behavior.
      likelihood: medium
      impact: high
      mitigation: Add reviewer gate for security-sensitive tasks, prefer printed guidance over implicit execution, and cover registry/CLI behavior with focused regression tests.
  assumptions:
    - Existing Click entrypoints in src/henchman/cli/app.py remain the primary Tier 1 command surface.
    - Project-local settings should follow the existing .henchman convention from README/PRD rather than introducing a second directory name.
    - Settings sync is file-based import/export only and must not require network services or hosted accounts.
    - Existing schema, console themes, and partial WebSearch wiring are sufficient primitives to extend rather than replace.

implementation_specification:
  code_structure: Shared Tier 1 behavior should be organized as thin CLI command handlers over reusable config/path/helper services, with compatibility shims isolated in small modules and tool registration normalized behind the existing ToolRegistry and ToolManager.
  affected_areas:
    - src/henchman/config/
    - src/henchman/cli/app.py
    - src/henchman/cli/commands/
    - src/henchman/tools/
    - src/henchman/agents/
    - src/henchman/core/
    - tests/cli/
    - tests/config/
    - tests/tools/
    - tests/agents/
  component_details:
    - component: Foundation compatibility surface
      responsibility: Restore missing public imports, re-exports, and small compatibility modules needed for clean imports and pytest collection without expanding beyond Tier 1.
      interfaces:
        - henchman.config.load_settings()
        - henchman.config.ContextLoader
        - henchman.tools.security sanitization helpers
        - henchman.tools.builtins exported tool classes
        - henchman.agents/core compatibility exports required by collection
    - component: Settings service
      responsibility: Resolve default, user, and project-local settings; validate schema; expose local import/export helpers; and provide key-based mutation helpers shared by commands.
      interfaces:
        - resolve_settings_paths()
        - load_settings()
        - save_settings()
        - export_settings()
        - import_settings()
        - get_setting_by_key()
        - set_setting_by_key()
        - unset_setting_by_key()
    - component: Operational CLI commands
      responsibility: Expose init, config, help search, version update check, doctor diagnostics, and guided upgrade behavior using the shared settings service and existing Click app.
      interfaces:
        - henchman init
        - henchman config view|get|set|unset|import|export
        - henchman help [query]
        - henchman version
        - henchman doctor
        - henchman upgrade [--run]
    - component: Tier 1 tool surface
      responsibility: Provide discoverable ToolSearchTool, SkillTool, WebSearchTool, and SleepTool behavior through ToolRegistry and ToolManager with consistent naming and guardrails.
      interfaces:
        - ToolSearchTool.execute(...)
        - SkillTool.execute(...)
        - WebSearchTool.execute(...)
        - SleepTool.execute(...)
        - ToolManager.register_builtin_tools()
  dependencies:
    - component: Operational CLI commands
      relationship: Depends on the settings service for path resolution, validation, persistence, and diagnostics inputs.
    - component: Tier 1 tool surface
      relationship: Depends on the foundation compatibility surface for builtins exports and shared security sanitization.
    - component: UI settings surfacing
      relationship: Depends on the settings service to persist output_style, theme, keybindings, and style overrides consistently.
    - component: Final acceptance gate
      relationship: Depends on all feature slices completing with green targeted tests and a clean collection checkpoint.
  integration_points:
    - Click CLI group and subcommand registration in src/henchman/cli/app.py
    - Slash/help command behavior in src/henchman/cli/commands/builtins.py
    - ToolRegistry and ToolManager built-in registration flow
    - Pydantic settings schema in src/henchman/config/schema.py
    - Console/theme rendering in src/henchman/cli/console.py and textual config consumers

